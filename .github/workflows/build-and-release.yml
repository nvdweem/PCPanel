# Build the Quarkus native image for Windows and Linux, wrap it in proper installers,
# and publish a pre-release.
#
# Why installers instead of the bare executable: the GraalVM native image is NOT a
# single self-contained file. native-image emits the executable PLUS a set of companion
# shared libraries (awt/fontmanager/lcms/jvm/... as *.dll on Windows, *.so on Linux) that
# the binary loads from its own directory at runtime via java.library.path. Shipping just
# the *-runner(.exe) — as the previous workflow did — produces a binary that crashes on
# first AWT/tray use. Every artifact below bundles the executable together with its libs.
#
#   Windows : per-user Inno Setup installer (no admin, installs under %LOCALAPPDATA%,
#             optional autostart on sign-in, launches after install)
#   Linux   : .deb (standard) + AppImage + best-effort Flatpak bundle
#   macOS   : best-effort .app bundled into an architecture-specific .dmg, ad-hoc signed
#             (valid signature, but not notarized — no Apple Developer ID). The macOS build
#             is experimental and runs continue-on-error so it never blocks the Windows/Linux
#             release if a runner image changes.

name: Build & Release
env:
  JAVA_VERSION: '25'        # GraalVM CE 25 — Quarkus 3.34.1 supports Java 25

# Releasing is triggered by a TAG, and the tag IS the version — nothing in the working tree
# carries a release version. That is deliberate: when a maintenance line (releases/2.0) never edits
# a version file, merging it forward into main only ever conflicts on real code. Committing the
# version instead made pom.xml + the AppStream metainfo conflict on *every* forward merge, because
# both branches edit the same line from a common ancestor.
#
#   push tag vX.Y.Z         -> STABLE release X.Y.Z, permanent tag, no commit required
#   workflow_dispatch       -> snapshot of whatever ref you pick
#
# Branch pushes never build. Snapshot builds are triggered manually via workflow_dispatch
# (Actions tab → "Build & Release" → "Run workflow" → pick the branch).
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

# One run per rolling release that a build publishes to, so two runs can never race on the same
# release: every dev-line ref (main, releases/**) publishes to `latest-snapshot` and therefore shares
# one group, while any other branch owns its own `latest-<branch>` and is keyed on its ref. A newer
# run supersedes an in-flight one instead of queueing behind it. A run cancelled mid-publish
# self-heals: the next run's scoped delete+create rebuilds the release cleanly.
concurrency:
  group: release-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/')) && 'latest-snapshot' || github.ref }}
  cancel-in-progress: true

jobs:
  buildWindows:
    name: Windows installer
    runs-on: windows-latest
    # Exposed so the pre-release job can flag when metadata generation degraded to committed metadata.
    outputs:
      genStatus: ${{ steps.gen.outcome }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # native-image-job-reports is intentionally OFF: it makes setup-graalvm pass
      # -H:BuildOutputJSONFile pointing at the runner's TEMP on C:, while the build output lives on
      # the workspace drive (D:). GraalVM's BuildArtifactsExporter then relativizes that JSON against
      # the output dir and crashes with "'other' has different root" (cross-drive). That report JSON
      # was the only artifact off the workspace drive; without it every produced artifact stays under
      # target/ on one drive and the native build is clean.
      - name: Set up GraalVM CE
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'graalvm-community'
          cache: 'maven'

      # Quinoa builds the frontend with the system Node (package-manager-install=false); Angular
      # CLI 22 refuses Node older than 22.22.3 / 24.15, so pin a new-enough Node explicitly instead
      # of relying on whatever the runner image ships.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/main/webui/package-lock.json

      # A vX.Y.Z tag produces that exact stable version; anything else produces a numbered snapshot
      # ("2.1.<run>") off the pom's <project.baseversion>. On a release, mvnVersionArgs overrides the
      # pom so the app self-reports the tag's version as a FINAL one (pcpanel.version = "2.0.85", no
      # -SNAPSHOT, so the update check treats it as a release rather than a pre-release) — which is how
      # the release version stays out of the tree entirely.
      # See docs/superpowers/specs/2026-07-15-release-versioning-strategy-design.md.
      - name: Compute app version
        id: ver
        shell: bash
        run: bash packaging/ci-version.sh >> "$GITHUB_OUTPUT"

      # Regenerate reachability metadata for THIS OS before compiling, so the native build
      # consumes proxy/reflection/JNI entries the tracing agent actually observed on Windows
      # rather than relying solely on the committed union. Merge mode (the native-config-gen
      # profile) keeps the other platforms' committed entries; process-resources then copies
      # the refreshed files into target/classes for the package step below. See README.md.
      - name: Generate native-image metadata
        id: gen
        # Non-blocking: a generation failure must never break the release. The build below then
        # falls back to the committed metadata union (ProxyRegistrationCoverageTest still guards
        # missing proxies). The failure is surfaced as a warning here and in the pre-release notes.
        continue-on-error: true
        shell: pwsh
        # Quote the -D property: PowerShell otherwise splits -Dquarkus.native.enabled=false and Maven
        # sees ".native.enabled=false" as a bogus lifecycle phase. (Bash on Linux/macOS needs no quotes.)
        run: mvn -Pnative-config-gen test "-Dquarkus.native.enabled=false" --file pom.xml

      - name: Warn if metadata generation failed
        if: steps.gen.outcome == 'failure'
        shell: pwsh
        run: Write-Output "::warning::Native-image metadata generation failed on Windows; the build used committed metadata (possibly stale)."

      - name: Install rcedit
        run: choco install rcedit --no-progress -y

      - name: Build native image (Windows)
        shell: pwsh
        # `verify` (not `package`) so the native integration tests (failsafe, NativeTestIT) run against
        # the produced binary and fail the release on native-image-only breakage that JVM unit tests
        # cannot see — most importantly NativeTestIT#fontEnumerationProvesAwtLoads, which catches a
        # native image whose awt.dll won't load (empty GraalVM java.dll/jvm.dll shim → dead overlay and
        # font picker). Bake the build-numbered version (<baseversion>.<run>) so the UI footer reports
        # it instead of the bare ${project.version} (2.0-SNAPSHOT). Quote the -D so PowerShell doesn't split it.
        run: |
          # Splat the release-only -D args via an array so PowerShell passes each as ONE intact
          # argument — a bare token gets split at the dot into "-Dproject" + ".snapshot=". Empty = no args.
          $verArgs = @(); $s = '${{ steps.ver.outputs.mvnVersionArgs }}'; if ($s) { $verArgs = $s -split ' ' }
          mvn -B verify -Pnative "-Dquarkus.application.version=${{ steps.ver.outputs.version }}" @verArgs --file pom.xml

      - name: Assemble distribution (exe + companion DLLs)
        shell: pwsh
        run: |
          $dist = "target/windows-dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $runner = Get-ChildItem target/*-runner.exe | Select-Object -First 1
          Copy-Item $runner.FullName "$dist/PCPanel.exe"
          # native-image drops the companion DLLs next to the runner in target/.
          Copy-Item target/*.dll $dist/ -ErrorAction SilentlyContinue
          Write-Host "Distribution contents:"
          Get-ChildItem $dist | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Get-ChildItem "$dist/*.dll" -ErrorAction SilentlyContinue)) {
            Write-Warning "No companion DLLs found next to the executable - the installer may be incomplete."
          }
          # GraalVM's java.dll/jvm.dll shims import the JVM/JNI symbols from the exe by its build-time
          # name; renaming the exe to PCPanel.exe (above) breaks that, so awt.dll can't load at runtime.
          # Rewrite the shim import name to match the renamed exe.
          & packaging/windows/patch-shim-imports.ps1 -DistDir $dist -OldName $runner.Name -NewName "PCPanel.exe"
          # native-image produces the exe without an icon; embed the app icon so the binary
          # (and the installer's shortcuts, which reference it) show the PCPanel logo.
          & packaging/windows/embed-icon.ps1 -ExePath "$dist/PCPanel.exe" -IconPath app-icon.ico

      - name: Smoke-test the assembled exe (AWT loads)
        shell: pwsh
        # The native IT runs the un-renamed runner, so it cannot see breakage introduced by the
        # rename/DLL-copy/icon-embed packaging. Run the EXACT shipped exe and assert the overlay font
        # list is non-empty (a broken AWT image returns []), failing the build before it ships.
        run: |
          $exe = (Resolve-Path target/windows-dist/PCPanel.exe).Path
          # -Dpcpanel.http.require-session=false: this smoke test hits the API to catch native-image
          # reflection gaps, not to test auth; without it every /api call (and the quit POST) 401s.
          $p = Start-Process $exe -ArgumentList "skipfilecheck","-Dquarkus.http.port=7799","-Dpcpanel.http.require-session=false" -PassThru -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          $up = $false
          for ($i = 0; $i -lt 60; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:7799/q/health).StatusCode -eq 200) { $up = $true; break } } catch {}; Start-Sleep 1 }
          # Poll the font list: a broken AWT image returns [] (count 0), a working one returns the system
          # fonts (~100+). Retry because the first call cold-loads awt.dll and Java2D, which can lag the
          # health check; measure from the parsed body (not @(Invoke-RestMethod).Count, which collapses a
          # null/empty response to 1 and masked a broken build once already).
          $count = 0; $rawLen = 0
          if ($up) {
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $raw = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://127.0.0.1:7799/api/overlay/fonts).Content
                $rawLen = $raw.Length
                $count = @([string[]]($raw | ConvertFrom-Json)).Count
                if ($count -gt 0) { break }
              } catch { Write-Host "fonts attempt ${i}: $_" }
              Start-Sleep 1
            }
          }
          # Beyond the AWT/fonts check, exercise the real REST API on the same running exe (#102): on
          # Windows audio and HID fully work, so these must return 200. A 5xx here is the "compiles
          # fine, 500s at runtime" native-image class (missing List<DTO> array reflection,
          # FileSerializer, JNA proxy/pointer registration) on the primary platform.
          $endpointFail = $null
          if ($up) {
            foreach ($ep in '/api/devices','/api/audio/devices','/api/audio/applications','/api/audio/selftest') {
              try {
                $code = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://127.0.0.1:7799$ep").StatusCode
                Write-Host "GET $ep -> $code"
                if ($code -ne 200) { $endpointFail = "$ep returned $code" }
              } catch { $endpointFail = "$ep threw $($_.Exception.Message)" }
            }
          } else { $endpointFail = 'server never became ready' }
          # Verify the in-UI Quit button actually shuts the exe down (POST /api/system/quit ->
          # Quarkus.asyncExit). Stop-Process below is only a fallback if quit didn't terminate it.
          $quitFail = $null
          if ($up -and -not $endpointFail) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -Method Post "http://127.0.0.1:7799/api/system/quit" | Out-Null } catch {}
            if ($p.WaitForExit(10000)) { Write-Host "Quit OK: PCPanel.exe shut down on request." }
            else { $quitFail = 'process did not exit within 10s of POST /api/system/quit' }
          }
          $log = "$env:USERPROFILE\.pcpanel\logs\logging.log"
          if (Test-Path $log) { Select-String -Path $log -Pattern 'UnsatisfiedLink|Can.t load library|Could not enumerate' | Select-Object -First 3 | ForEach-Object { Write-Host "LOG> $($_.Line)" } }
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          Write-Host "Assembled PCPanel.exe font families: $count (raw body $rawLen bytes)"
          if ($count -lt 10) {
            if (Test-Path smoke.out) { Get-Content smoke.out | Select-Object -Last 40 | ForEach-Object { Write-Host $_ } }
            throw "Assembled PCPanel.exe enumerated only $count font families - AWT did not load; the shipped installer would have a dead overlay and font picker."
          }
          if ($endpointFail) {
            if (Test-Path smoke.out) { Get-Content smoke.out | Select-Object -Last 40 | ForEach-Object { Write-Host $_ } }
            throw "Assembled PCPanel.exe REST smoke failed: $endpointFail (a 5xx usually means a native-image reflection/registration gap)."
          }
          if ($quitFail) {
            if (Test-Path smoke.out) { Get-Content smoke.out | Select-Object -Last 40 | ForEach-Object { Write-Host $_ } }
            throw "Assembled PCPanel.exe quit check failed: $quitFail"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=$(Resolve-Path target/windows-dist)" `
            "/DOutputDir=$(Resolve-Path target)" `
            packaging/windows/pcpanel.iss

      - name: Store artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: ./target/PCPanel-*-setup.exe
          if-no-files-found: error

  buildLinux:
    name: Linux .deb + AppImage
    runs-on: ubuntu-latest
    # Exposed so the pre-release job can flag when metadata generation degraded to committed metadata.
    outputs:
      genStatus: ${{ steps.gen.outcome }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up GraalVM CE
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
          cache: 'maven'

      # Quinoa builds the frontend with the system Node (package-manager-install=false); Angular
      # CLI 22 refuses Node older than 22.22.3 / 24.15, so pin a new-enough Node explicitly instead
      # of relying on whatever the runner image ships.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/main/webui/package-lock.json

      # See the Windows job: tag vX.Y.Z -> that exact version, else "<baseversion>.<run>".
      - name: Compute app version
        id: ver
        shell: bash
        run: bash packaging/ci-version.sh >> "$GITHUB_OUTPUT"

      # Which self-update channels this build publishes to (see packaging/ci-channel.sh). The tag list
      # decides whether a release may claim the rolling channels, so it has to be present first.
      - name: Compute update channels
        id: chan
        shell: bash
        run: |
          git fetch --tags --quiet || true
          bash packaging/ci-channel.sh >> "$GITHUB_OUTPUT"

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Regenerate reachability metadata for THIS OS before compiling (see the Windows job for the
      # rationale). Runs under xvfb because the native-config-gen profile sets java.awt.headless=false
      # and the generation-only keystroke test synthesises a key press that loads libX11/libXtst.
      - name: Generate native-image metadata
        id: gen
        # Non-blocking (see the Windows job): a generation failure must never break the release;
        # the build falls back to committed metadata and the failure is surfaced as a warning.
        continue-on-error: true
        run: xvfb-run -a mvn -Pnative-config-gen test -Dquarkus.native.enabled=false --file pom.xml

      - name: Warn if metadata generation failed
        if: steps.gen.outcome == 'failure'
        run: echo "::warning::Native-image metadata generation failed on Linux; the build used committed metadata (possibly stale)."

      - name: Build native image (Linux)
        # A unit test (VolumeOverlayNativeTest) constructs a Swing overlay window, which throws
        # HeadlessException on the display-less runner. Run the whole build under a virtual X server
        # so the AWT/Swing tests have a display; native-image compilation itself is headless-safe.
        # Bake the build-numbered version (<baseversion>.<run>) into the app so the UI footer reports it
        # instead of the bare ${project.version} (2.0-SNAPSHOT). The Flatpak job reuses this binary, so it
        # inherits the same version.
        run: xvfb-run -a mvn -B package -Pnative -Dquarkus.application.version=${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.mvnVersionArgs }} --file pom.xml

      - name: Smoke-test the native binary (boots and serves)
        # Boot the freshly built runner and assert the REST API answers — the same cheap, high-value
        # check the macOS job runs, which catches the "compiles fine, 500s at runtime" native-image
        # class (#102). /api/devices is required (HID + device layer must serialize). /api/audio/* is
        # lenient: the CI runner has no PulseAudio and Linux audio degrades to a no-op ISndCtrl by
        # design, so a non-200 there warns rather than fails. Mirrors the macOS intent — NOT
        # continue-on-error (a real runtime regression turns this job red), but preRelease gates on the
        # job outcome and a red Linux job is meaningful since Linux is a shipped platform.
        run: |
          exe=$(ls target/*-runner | head -1)
          bash packaging/smoke-test.sh "$exe" --port 7766 \
            --require /api/devices \
            --lenient /api/audio/devices --lenient /api/audio/applications --lenient /api/audio/selftest \
            --quit-check

      # Cache the bundled kdotool download (Apache-2.0) across runs; the key changes only when
      # fetch-kdotool.sh (which pins the version + sha256) changes, so it is downloaded once per pin.
      - name: Cache kdotool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pcpanel-kdotool
          key: kdotool-${{ hashFiles('packaging/linux/fetch-kdotool.sh') }}

      # Downloaded once per pin, same pattern as kdotool (see fetch-appimageupdatetool.sh).
      - name: Cache appimageupdatetool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pcpanel-appimageupdatetool
          key: appimageupdatetool-${{ hashFiles('packaging/linux/fetch-appimageupdatetool.sh') }}

      # The AppStream <release> entry is derived, not committed — stamp the version being built into
      # the copy the .deb / AppImage install. Keeping it out of the tree is what stops a release from
      # touching a versioned file (and therefore from conflicting on every forward merge).
      - name: Stamp AppStream metainfo
        run: bash packaging/linux/stamp-metainfo.sh "${{ steps.ver.outputs.version }}"

      - name: Build .deb
        run: |
          exe=$(ls target/*-runner | head -1)
          bash packaging/linux/build-deb.sh "${{ steps.ver.outputs.version }}" "$exe" target

      - name: Build AppImage
        env:
          # Pinned appimagetool release + sha256 (supply-chain integrity: the download is verified
          # against this digest and the step fails on any mismatch). To refresh: pick the release/
          # asset from `gh api repos/AppImage/appimagetool/releases` and copy its `digest` (sha256)
          # for appimagetool-x86_64.AppImage, then update both values below.
          APPIMAGETOOL_VERSION: '1.9.1'
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
        run: |
          # Recommended download for immutable distros: single sandbox-free file.
          curl -fsSL --retry 3 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          export APPIMAGETOOL="$PWD/appimagetool"
          export APPIMAGE_EXTRACT_AND_RUN=1   # CI runners have no FUSE
          export ARCH=x86_64
          # Bake self-update info so the AppImage can update itself in place (zsync), pointed at the
          # channel this build's own release belongs to: `latest` for a stable release (a magic value
          # meaning GitHub's newest non-prerelease), `latest-snapshot` for a development-line build, or
          # the branch's self-contained pre-release for anything else. appimagetool also emits
          # PCPanel-*-x86_64.AppImage.zsync next to the output; preRelease uploads it alongside.
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          export UPDATE_INFO="gh-releases-zsync|${owner}|${repo}|${{ steps.chan.outputs.zsyncTag }}|PCPanel-*-x86_64.AppImage.zsync"
          exe=$(ls target/*-runner | head -1)
          bash packaging/linux/appimage/build-appimage.sh "${{ steps.ver.outputs.version }}" "$exe" target

      # A stable release reaches snapshot installs too, so it is also published to `latest-snapshot`.
      # The zsync target is baked into the file, which is why that copy has to be built separately: an
      # identical AppImage that keeps following the snapshot channel, so the users it pulls onto the
      # final build still receive the next snapshot instead of silently becoming stable-channel users.
      - name: Build AppImage for the snapshot channel
        if: steps.chan.outputs.mirrorToSnapshot == 'true'
        run: |
          export APPIMAGETOOL="$PWD/appimagetool"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          export UPDATE_INFO="gh-releases-zsync|${owner}|${repo}|${{ steps.chan.outputs.snapshotTag }}|PCPanel-*-x86_64.AppImage.zsync"
          exe=$(ls target/*-runner | head -1)
          bash packaging/linux/appimage/build-appimage.sh "${{ steps.ver.outputs.version }}" "$exe" target/snapshot-channel

      - name: Store .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: ./target/*.deb
          if-no-files-found: error

      - name: Store AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          # The .zsync control file must ship next to the AppImage on the release, or the bundled
          # appimageupdatetool cannot find what to pull. The snapshot-channel copy of a release rides
          # along in its own subdirectory (the two builds share a filename) and is present only on a
          # release; preRelease publishes it to the rolling snapshot release instead of to this one.
          path: |
            ./target/*.AppImage
            ./target/*.AppImage.zsync
            ./target/snapshot-channel/*.AppImage
            ./target/snapshot-channel/*.AppImage.zsync
          if-no-files-found: error

      # Hand the native binary + companion .so libraries to the buildFlatpak job, which runs inside
      # the freedesktop SDK container. This is an inter-job hand-off, not a release asset — preRelease
      # strips it before publishing.
      - name: Upload native binary for the Flatpak job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-native
          path: |
            target/*-runner
            target/*.so
          if-no-files-found: error

  # Flatpak runs in its own job inside bilelmoussaoui/flatpak-github-actions:freedesktop-24.08, which
  # already ships the freedesktop Platform + SDK. That removes the ~16 min `flatpak install` download
  # the old host-based step paid on every run (the module itself is buildsystem: simple — no compile).
  # Best-effort: the flatpak-builder step is continue-on-error so a failure never blocks the release.
  buildFlatpak:
    name: Linux Flatpak (best-effort)
    needs: buildLinux
    runs-on: ubuntu-latest
    # Job-level continue-on-error: even a container-start failure (bad image, infra) must not fail the
    # run or block the release. preRelease gates only on the required Windows/Linux jobs (see its `if`).
    continue-on-error: true
    # contents: write is for pushing the updated OSTree repo to the gh-pages branch (Flatpak updates).
    permissions:
      contents: write
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # This job runs in a container, so the user git runs as is not the one that owns the checkout
      # and git refuses to read the repository at all ("detected dubious ownership", exit 128). Every
      # later step that shells out to git depends on this, so it is marked safe once, here, before the
      # first of them rather than in each.
      - name: Trust the checkout
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # See the Windows job: releases/** -> clean "2.0", else "2.0.<run>". (This job repackages the
      # Linux native binary, so it only needs the version string for artifact naming.)
      - name: Compute app version
        id: ver
        shell: bash
        run: bash packaging/ci-version.sh >> "$GITHUB_OUTPUT"

      # Which OSTree refs this build publishes to (see packaging/ci-channel.sh).
      - name: Compute update channels
        id: chan
        shell: bash
        run: |
          git fetch --tags --quiet || true
          bash packaging/ci-channel.sh >> "$GITHUB_OUTPUT"

      - name: Download native binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-native
          path: native

      # Same cache as the buildLinux job: kdotool is downloaded once per pin (see fetch-kdotool.sh).
      - name: Cache kdotool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pcpanel-kdotool
          key: kdotool-${{ hashFiles('packaging/linux/fetch-kdotool.sh') }}

      - name: Stage manifest sources
        run: |
          set -euxo pipefail
          # The manifest resolves its `sources: path:` entries relative to its own directory, so stage
          # everything it references next to a copy of the manifest (mirrors the previous host step).
          build=flatpak-build
          mkdir -p "$build"
          cp packaging/linux/flatpak/com.getpcpanel.PCPanel.yml "$build/"
          cp packaging/linux/flatpak/pcpanel-launcher.sh "$build/"
          cp packaging/linux/flatpak/host-spawn-wrapper.sh "$build/"
          cp packaging/linux/flatpak/kdotool-wrapper.sh "$build/"
          cp packaging/linux/com.getpcpanel.PCPanel.desktop "$build/"
          # Same as the .deb/AppImage job: the <release> entry is derived from the built version.
          bash packaging/linux/stamp-metainfo.sh "${{ steps.ver.outputs.version }}"
          cp packaging/linux/com.getpcpanel.PCPanel.metainfo.xml "$build/"
          cp app-icon.png "$build/"
          # kdotool binary + Apache-2.0 license bundled inside the sandbox (see manifest).
          bash packaging/linux/fetch-kdotool.sh "$build"
          # Native executable + companion .so libraries as a flat tarball.
          stage=$(mktemp -d)
          cp "$(ls native/*-runner | head -1)" "$stage/PCPanel"
          cp native/*.so "$stage/" 2>/dev/null || true
          tar -czf "$build/pcpanel-native.tar.gz" -C "$stage" .

      # Build the Flatpak into a persistent OSTree repo (not just a one-shot bundle) so installs from the
      # hosted repo can `flatpak update`. The repo lives on the gh-pages branch and carries exactly two
      # rolling refs — `stable` (from a release) and `snapshot` (from the development line) — each pruned
      # to its single latest commit, so the published site stays small (GitHub Pages caps at ~1 GB). We
      # clone the existing gh-pages repo first and build into it, so the *other* channel's ref survives
      # this run. The single-file .flatpak bundle is still produced as a direct-download release asset.
      - name: Build Flatpak (OSTree repo + bundle)
        id: flatpak
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          channel=snapshot
          if [ "${{ steps.chan.outputs.isRelease }}" = "true" ]; then channel=stable; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

          # Start from the currently published repo so we don't drop the other channel's ref. A shallow
          # clone still contains every file at HEAD (depth limits history, not content). First publish
          # (no gh-pages yet) starts empty; flatpak-builder --repo initialises the OSTree repo.
          git config --global --add safe.directory "$PWD"
          if git clone --depth 1 --branch gh-pages \
               "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site 2>/dev/null; then
            echo "Reusing existing gh-pages repo"
          else
            echo "No gh-pages yet; starting a fresh site"
            mkdir -p site
          fi
          mkdir -p site/repo
          # git does not store empty directories, so a repo cloned back from gh-pages is missing OSTree's
          # empty ref dirs (refs/remotes, refs/mirrors) and tmp/. `ostree prune` then dies with
          # "opendir(refs/remotes): No such file or directory". Recreate them before any ostree op.
          mkdir -p site/repo/refs/heads site/repo/refs/remotes site/repo/refs/mirrors site/repo/tmp

          # Unsigned repo (the .flatpakref carries no GPGKey); served over HTTPS from Pages.
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=site/repo --default-branch="$channel" \
            builddir flatpak-build/com.getpcpanel.PCPanel.yml

          flatpak build-bundle site/repo "PCPanel-${{ steps.ver.outputs.version }}.flatpak" \
            com.getpcpanel.PCPanel "$channel"

          # A release reaches snapshot installs too: copy this build's commits onto the snapshot ref, so
          # an install on that channel moves to the final build and keeps following the channel — the
          # next development build reaches it as usual. The objects are already in the repo, so this
          # deduplicates rather than rebuilding. Covers the .Debug/.Locale refs alongside the app.
          if [ "${{ steps.chan.outputs.mirrorToSnapshot }}" = "true" ]; then
            for ref in $(ostree refs --repo=site/repo | grep '/stable$' || true); do
              flatpak build-commit-from --src-repo=site/repo --src-ref="$ref" \
                site/repo "${ref%/stable}/snapshot"
            done
          fi

          # Keep only the newest commit per ref, then regenerate the summary/metadata.
          ostree prune --repo=site/repo --refs-only --depth=0
          flatpak build-update-repo --prune site/repo

          # Static site: the .flatpakref install files, an OS-detecting landing page that renders the
          # README, and .nojekyll so GitHub Pages serves the OSTree object tree verbatim (Jekyll would
          # drop files it considers special). index.html fetches ./README.md and app-icon.png at view
          # time, so ship both alongside it.
          cp packaging/linux/flatpak/com.getpcpanel.PCPanel.stable.flatpakref   site/
          cp packaging/linux/flatpak/com.getpcpanel.PCPanel.snapshot.flatpakref site/
          cp packaging/linux/flatpak/pages-index.html site/index.html
          cp README.md site/README.md
          cp app-icon.png site/app-icon.png
          touch site/.nojekyll

      # Publish the merged repo to gh-pages. force_orphan keeps a single commit (the OSTree objects are
      # large — history would balloon), which is safe because `site/` already contains the full merged
      # repo. Only on the canonical repo, so forks don't try to push, and only for a build that owns a
      # channel: the repo carries the two refs real users follow, so a feature branch's test build is
      # built and attached as a .flatpak bundle but must not take one of them over.
      - name: Publish Flatpak repo to GitHub Pages
        id: publish
        if: steps.flatpak.outcome == 'success' && github.repository == 'nvdweem/PCPanel' && steps.chan.outputs.feedsSharedChannel == 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Store Flatpak artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: PCPanel-*.flatpak
          if-no-files-found: ignore

      # Make a Flatpak/Pages failure VISIBLE. Both steps above are continue-on-error so the release is
      # never blocked (.deb + AppImage still ship), but that previously let a real failure show up green.
      # This marks the JOB red when the build failed or the gh-pages publish failed; the job-level
      # continue-on-error still keeps the overall run — and the release — passing.
      - name: Flag Flatpak/Pages failure
        if: always() && (steps.flatpak.outcome != 'success' || steps.publish.outcome == 'failure')
        run: |
          echo "::error::Flatpak build or gh-pages publish failed (build=${{ steps.flatpak.outcome }}, publish=${{ steps.publish.outcome }}); gh-pages was NOT updated. The release still shipped .deb + AppImage."
          exit 1

  buildMac:
    name: macOS .dmg (best-effort)
    # A native image is architecture-specific machine code, so an Apple Silicon (arm64) build does NOT
    # run on Intel Macs (and Rosetta only goes x86_64 -> arm64, not the reverse). We therefore build
    # both architectures:
    #   - macos-latest   : Apple Silicon (arm64). Tracks GitHub's current image so it cannot be retired
    #                      out from under us (as the pinned macos-13 was).
    #   - macos-15-intel : Intel (x86_64), GitHub's free successor to the retired macos-13 Intel image.
    # The sources are architecture-independent; each runner just emits its own arch's binary + .dmg.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up GraalVM CE
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
          cache: 'maven'

      # Quinoa builds the frontend with the system Node (package-manager-install=false); Angular
      # CLI 22 refuses Node older than 22.22.3 / 24.15, so pin a new-enough Node explicitly instead
      # of relying on whatever the runner image ships.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/main/webui/package-lock.json

      # See the Windows job: tag vX.Y.Z -> that exact version, else "<baseversion>.<run>".
      - name: Compute app version
        id: ver
        shell: bash
        run: bash packaging/ci-version.sh >> "$GITHUB_OUTPUT"

      # Regenerate reachability metadata for THIS OS before compiling (see the Windows job for the
      # rationale). Best-effort like the rest of the macOS leg: the headless runner makes the AWT
      # generation tests fail, but merge mode persists whatever was captured before the failure, and
      # a failure here must not block the Windows/Linux release.
      - name: Generate native-image metadata
        id: gen
        continue-on-error: true
        run: mvn -Pnative-config-gen test -Dquarkus.native.enabled=false --file pom.xml

      - name: Warn if metadata generation failed
        if: steps.gen.outcome == 'failure'
        run: echo "::warning::Native-image metadata generation failed on macOS (${{ matrix.runner }}); the build used committed metadata (possibly stale)."

      # macOS detection (os.detected.name) resolves pcpanel.build.os to "osx", so the @MacBuild
      # beans are included automatically; no extra flags are needed.
      - name: Build native image (macOS)
        id: build
        continue-on-error: true
        # Bake the build-numbered version (<baseversion>.<run>) into the app so the UI footer reports it
        # instead of the bare ${project.version} (2.0-SNAPSHOT).
        run: mvn -B package -Pnative -Dquarkus.application.version=${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.mvnVersionArgs }} --file pom.xml

      - name: Assemble .app bundle
        id: assemble
        # Tolerated like the rest of the macOS leg: if the native build above failed there is no
        # runner binary to wrap, so this step fails and the sign/verify/dmg steps below are skipped,
        # the job stays green, and the Windows/Linux release is never blocked. A *signing* regression,
        # by contrast, fails the dedicated (non-continue-on-error) step below and turns the job red.
        continue-on-error: true
        run: |
          set -euxo pipefail
          exe=$(ls target/*-runner | head -1)
          app="target/PCPanel.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$exe" "$app/Contents/MacOS/PCPanel"
          chmod +x "$app/Contents/MacOS/PCPanel"
          # native-image drops the companion .dylib files next to the runner; keep them beside the binary.
          cp target/*.dylib "$app/Contents/MacOS/" 2>/dev/null || true
          cp app-icon.icns "$app/Contents/Resources/PCPanel.icns" 2>/dev/null || true
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>PCPanel</string>
            <key>CFBundleDisplayName</key><string>PCPanel</string>
            <key>CFBundleIdentifier</key><string>com.getpcpanel.PCPanel</string>
            <key>CFBundleVersion</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>PCPanel</string>
            <key>CFBundleIconFile</key><string>PCPanel</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAudioCaptureUsageDescription</key><string>PCPanel taps an application's audio to control its volume (per-app and focused-app volume).</string>
          </dict>
          </plist>
          PLIST

      - name: Sign and smoke-test the .app bundle
        # Runs only when assembly produced a bundle, so a tolerated native-build failure doesn't turn
        # the job red. Intentionally NOT continue-on-error: if the assembled app can't be signed or
        # won't actually run, this job MUST go red so the regression is caught. That failure still does
        # not block the release — preRelease gates only on the Windows/Linux jobs (its `if` uses
        # !cancelled()).
        if: steps.assemble.outcome == 'success'
        run: |
          set -euxo pipefail
          app="target/PCPanel.app"
          bin="$app/Contents/MacOS/PCPanel"

          # --- Sign (ad-hoc; the issue-#101 fix) -------------------------------------------------
          # We have no Apple Developer ID, so this is an *ad-hoc* signature (`--sign -`): it does not
          # pass notarization, but it produces a structurally VALID signature, which is what macOS
          # actually requires to launch. On Apple Silicon the kernel refuses to run any Mach-O without
          # at least an ad-hoc signature (unsigned arm64 code is SIGKILLed at exec). GraalVM's linker
          # already ad-hoc-signs the runner binary, so it carries a bundle CodeDirectory that reserves
          # a slot for a sealed-resources manifest — but nothing ever signed the *bundle*, so
          # `Contents/_CodeSignature/CodeResources` was missing. That half-signed state is precisely
          # the "code has no resources but signature indicates they must be present" / "PCPanel is
          # damaged" failure (issue #101), and removing the quarantine xattr cannot fix it. Signing the
          # bundle generates the CodeResources manifest and makes the quarantine workaround work again.
          #
          # All bundle mutation (binary, dylibs, icon, Info.plist) happened in the assemble step —
          # touching any bundled file after signing would invalidate the seal. We sign inside-out
          # (every nested Mach-O first, the bundle last); `--deep` signing is deprecated by Apple and
          # is NOT used here. No entitlements are passed: the cs.* entitlements only take effect under
          # the Hardened Runtime, which an ad-hoc signature does not enable, so they would be inert.
          xattr -cr "$app"
          find "$app/Contents" -type f \( -name '*.dylib' -o -name '*.jnilib' -o -name '*.so' \) \
            -exec codesign --force --sign - --timestamp=none {} +
          codesign --force --sign - --timestamp=none "$app"

          # --- Smoke test: the app must actually START and DO WORK -------------------------------
          # This is the primary gate (shared with the Linux job via packaging/smoke-test.sh): boot the
          # bundled binary, wait for the embedded HTTP server, then exercise real REST endpoints.
          # Reaching them with HTTP 200 proves the native image boots, Quarkus starts, the server binds,
          # and backend state round-trips through JSON (so it also guards the native-image serialization
          # footguns called out in CLAUDE.md — List<DTO> array reflection, FileSerializer). On macOS
          # audio and HID fully work, so /api/audio/* are *required* here. Code signing is verified as a
          # side effect: an invalidly signed bundle is SIGKILLed at exec, so the server never comes up
          # and this fails — which is why this still catches a signing regression even without the
          # `codesign --verify` bonus check below.
          # /api/audio/selftest re-applies the default device's current volume/mute (a no-op) to drive
          # the settable WRITE path (isSettable → ByteByReference), which the read endpoints miss — this
          # is what reproduces #105 at runtime on macOS.
          bash packaging/smoke-test.sh "$bin" --port 7654 \
            --require /api/devices --require /api/audio/devices --require /api/audio/applications \
            --require /api/audio/selftest \
            --require-hid --quit-check

          # --- Bonus: explicit signature confirmation (a benefit, not the primary gate) ----------
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --display --verbose=4 "$app" || true

      - name: Create .dmg
        # An `if:` without a status function is ANDed with success(), so this is skipped automatically
        # if the sign/verify step failed — we never package an unverified bundle. Gating on assembly
        # also cleanly skips it when the native build was the thing that failed.
        if: steps.assemble.outcome == 'success'
        run: |
          set -euxo pipefail
          arch=$(uname -m)   # arm64 or x86_64
          app="target/PCPanel.app"
          dmg="target/PCPanel-${{ steps.ver.outputs.version }}-${arch}.dmg"
          # NB: the host volume has plenty of free space — the earlier "hdiutil: create failed - No
          # space left on device" was hdiutil AUTO-SIZING the temporary image from the source folder
          # and coming up just short for the large (signed) runner binary, so the copy overflowed the
          # image itself. Size it explicitly instead: build a writable image at bundle-size + headroom,
          # then convert to the compressed read-only UDZO we ship.
          appkb=$(du -sk "$app" | awk '{print $1}')
          sizemb=$(( appkb / 1024 + 300 ))
          hdiutil create -volname PCPanel -srcfolder "$app" -ov -format UDRW -size "${sizemb}m" target/PCPanel-rw.dmg
          hdiutil convert target/PCPanel-rw.dmg -format UDZO -ov -o "$dmg"
          rm -f target/PCPanel-rw.dmg
          ls -lh "$dmg"

      - name: Store .dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg-${{ runner.arch }}
          path: ./target/PCPanel-*.dmg
          if-no-files-found: ignore

  preRelease:
    name: Publish (release or snapshot)
    needs:
      - buildWindows
      - buildLinux
      - buildFlatpak
      - buildMac
    runs-on: ubuntu-latest
    # Wait for every build (so a successful Flatpak/macOS artifact is ready to attach) but only require
    # the Windows and Linux installers — Flatpak and macOS are best-effort and must never block a release.
    if: ${{ !cancelled() && needs.buildWindows.result == 'success' && needs.buildLinux.result == 'success' }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Which self-update channels this build publishes to (see packaging/ci-channel.sh).
      - name: Compute update channels
        id: chan
        run: |
          git fetch --tags --quiet || true
          bash packaging/ci-channel.sh >> "$GITHUB_OUTPUT"

      # Two publishing modes keyed off the ref:
      #   tag vX.Y.Z    -> a STABLE release under that exact tag, NOT a pre-release. Marked Latest only
      #                    when it is the highest released version, so a maintenance patch published
      #                    after a newer line (2.0.86 once 2.1 is out) cannot steal the Latest badge.
      #   anything else -> a SNAPSHOT: a rolling pre-release (deleted and recreated each run so it always
      #                    points at the newest commit) — `latest-snapshot` for the development line,
      #                    `latest-<branch>` for any other branch.
      - name: Compute release identity
        run: |
          if [ "${{ steps.chan.outputs.isRelease }}" = "true" ]; then
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
            echo "TAG_NAME=${{ steps.chan.outputs.releaseTag }}" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=${{ steps.chan.outputs.releaseTag }}" >> "$GITHUB_ENV"
            echo "IS_NEWEST=${{ steps.chan.outputs.isNewest }}" >> "$GITHUB_ENV"
          else
            base=$(grep -oP '(?<=<project\.baseversion>)[^<]+' pom.xml | head -1)
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
            echo "TAG_NAME=${{ steps.chan.outputs.snapshotTag }}" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=v${base}-SNAPSHOT Pre-Release (${GITHUB_RUN_NUMBER})" >> "$GITHUB_ENV"
          fi

      # Snapshots only: a stable release keeps its permanent tag, so never delete/recreate it.
      - name: Remove existing pre-release for this branch
        if: env.IS_RELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only delete THIS branch's snapshot pre-release (tag == $TAG_NAME).
          # Other branches' snapshots and every stable (non-prerelease) release are
          # left untouched — deleting all prereleases repo-wide would wipe unrelated
          # snapshots such as the 1.8 `latest-windows-main` build.
          gh api repos/{owner}/{repo}/releases \
            --jq ".[] | select(.tag_name == \"$TAG_NAME\") | .id" \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Remove previous tag
        if: env.IS_RELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api /repos/{owner}/{repo}/git/refs/tags/"$TAG_NAME" >/dev/null 2>&1; then
            gh api --method DELETE -H "Accept: application/vnd.github.v3+json" /repos/{owner}/{repo}/git/refs/tags/"$TAG_NAME"
            echo "Deleted tag $TAG_NAME"
          else
            echo "Tag $TAG_NAME does not exist; skipping delete"
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_GEN: ${{ needs.buildWindows.outputs.genStatus }}
          LIN_GEN: ${{ needs.buildLinux.outputs.genStatus }}
        run: |
          notes="$(sed '/##/Q' CHANGELOG.md)"
          # The gen step is non-blocking, so a build can still succeed while its native-image
          # metadata silently fell back to the committed (possibly stale) union. Flag that here
          # so a degraded build is visible on the release page, not just buried in the run log.
          warnings=""
          if [ "$WIN_GEN" = "failure" ]; then
            warnings="${warnings}- ⚠️ Windows: native-image metadata generation failed; built with committed metadata (possibly stale)."$'\n'
          fi
          if [ "$LIN_GEN" = "failure" ]; then
            warnings="${warnings}- ⚠️ Linux: native-image metadata generation failed; built with committed metadata (possibly stale)."$'\n'
          fi
          if [ -n "$warnings" ]; then
            notes="${notes}"$'\n\n'"### ⚠️ Build warnings"$'\n'"${warnings}"
          fi
          printf '%s' "$notes" > "$RUNNER_TEMP/release-notes.md"
          # A stable release is NOT a pre-release; a snapshot is a rolling pre-release. "Latest" is
          # claimed only by the highest released version — a 2.0.x maintenance patch cut after 2.1 is
          # out must not demote 2.1 on the releases page or in the update check.
          if [ "$IS_RELEASE" = "true" ]; then
            gh release create "$TAG_NAME" \
              --latest="$IS_NEWEST" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG_NAME" \
              --prerelease \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # linux-native (raw runner + .so) is the buildLinux -> buildFlatpak hand-off, not a release
          # asset; drop it so only the installers/bundles are published.
          rm -f dist/*-runner dist/*.so
          # The snapshot-channel AppImage belongs to the rolling snapshot release, not to this one.
          if [ -d dist/snapshot-channel ]; then
            mv dist/snapshot-channel "$RUNNER_TEMP/snapshot-channel"
          fi
          gh release upload "$TAG_NAME" dist/*

      # A release is published to the snapshot channel as well, so an install following `latest-snapshot`
      # moves onto the final build. It carries the same asset set as the release itself, with the AppImage
      # swapped for the copy that bakes `latest-snapshot` — that is what keeps those users on the channel,
      # so the next development build reaches them instead of stranding them on the stable channel.
      - name: Publish the release to the snapshot channel
        if: steps.chan.outputs.mirrorToSnapshot == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_TAG: ${{ steps.chan.outputs.snapshotTag }}
        run: |
          # Check before deleting anything: publishing the channel without its AppImage would leave
          # snapshot installs pointing at a release that has nothing for them to pull.
          if [ ! -d "$RUNNER_TEMP/snapshot-channel" ]; then
            echo "::error::No snapshot-channel AppImage was built; refusing to replace $SNAPSHOT_TAG."
            exit 1
          fi
          gh api repos/{owner}/{repo}/releases \
            --jq ".[] | select(.tag_name == \"$SNAPSHOT_TAG\") | .id" \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}
          if gh api /repos/{owner}/{repo}/git/refs/tags/"$SNAPSHOT_TAG" >/dev/null 2>&1; then
            gh api --method DELETE -H "Accept: application/vnd.github.v3+json" /repos/{owner}/{repo}/git/refs/tags/"$SNAPSHOT_TAG"
          fi
          # Titled exactly like the stable release, so the update check reads it as that final version
          # rather than as a newer pre-release and offers no phantom update. Still flagged --prerelease
          # so the rolling tag cannot claim the Latest badge from the release itself.
          # --target names the commit to create the rolling tag at: it was just deleted above, so it does
          # not exist on the remote here, and the checkout's local copy of it would otherwise make gh
          # refuse ("exists locally but has not been pushed") rather than create it.
          gh release create "$SNAPSHOT_TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          rm -f dist/*.AppImage dist/*.AppImage.zsync
          cp "$RUNNER_TEMP"/snapshot-channel/* dist/
          gh release upload "$SNAPSHOT_TAG" dist/*
          gh release edit "$TAG_NAME" --draft=false
