# Runs the macOS process lookup (OsxProcessHelper) against the real lsappinfo on GitHub's macOS images:
# the frontmost app (focus volume, focus override, closing the focused app) and the running-app list.
# Manual only: macOS runners are the expensive ones. The test log prints the raw lsappinfo output of
# each image, which shows the format a macOS version answers in.

name: macOS lsappinfo
env:
  JAVA_VERSION: '25'        # GraalVM CE 25 — keep in sync with build-and-release.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lsappinfo:
    name: lsappinfo (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up GraalVM CE
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1.5.6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Test against lsappinfo
        run: >
          ./mvnw -B test -Dquarkus.native.enabled=false -Dpcpanel.mactest=true
          -Dtest='OsxProcessHelperMacTest,OsxProcessHelperTest' -Dsurefire.failIfNoSpecifiedTests=false

