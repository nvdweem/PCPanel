# Runs the macOS-only tests that need the real OS on GitHub's macOS images: the process lookup
# (OsxProcessHelper) against lsappinfo (the frontmost app and the running-app list), the system media-key
# NSEvents (built, never posted) and the Accessibility check with its prompt options.
# Manual only: macOS runners are the expensive ones. The test log prints the raw lsappinfo output of
# each image, which shows the format a macOS version answers in.

name: macOS native tests
env:
  GRAALVM_VERSION: '25i-latest'   # GraalVM CE 25's newest innovation release: JDK 25 patches ship only there
  JAVA_VERSION: '25'               # Intel macOS only: GraalVM CE's last x64 macOS build is 25.0.1, innovation releases have none

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lsappinfo:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up GraalVM CE
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          version: ${{ matrix.runner != 'macos-15-intel' && env.GRAALVM_VERSION || '' }}
          java-version: ${{ matrix.runner == 'macos-15-intel' && env.JAVA_VERSION || '' }}
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Test against macOS
        run: >
          ./mvnw -B test -Dquarkus.native.enabled=false -Dpcpanel.mactest=true
          -Dtest='OsxProcessHelperMacTest,OsxProcessHelperTest,OsxSystemMediaKeysMacTest,OsxPermissionHelperMacTest,CoreAudioWrapperMacTest' -Dsurefire.failIfNoSpecifiedTests=false

