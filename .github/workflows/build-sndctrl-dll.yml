name: Build SndCtrl.dll (Windows)

# Manual, on-demand build of the Windows native audio library SndCtrl.dll with MSVC.
# It ONLY builds the DLL and holds it as a workflow artifact — it does not attach it to a
# release or commit it. Download the artifact and commit src/main/resources/SndCtrl.dll by hand
# after changing the C++ sources under src/main/cpp/ (e.g. when SndCtrlNative's package changes).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The build needs the Windows JNI headers (include/ + include/win32/jni_md.h), nothing more.
      - name: Set up JDK (for JNI headers)
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (CMake + MSVC)
        shell: pwsh
        run: cmake -S src/main/cpp -B build -G "Visual Studio 17 2022" -A x64 "-DWIN_JDK_HOME=$env:JAVA_HOME"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      # Log the exported JNI entry points so a package mismatch is visible in the run output.
      # dumpbin lives in the MSVC toolchain and is only on PATH inside a VS dev shell, so locate it
      # through vswhere. `-requires` the VC tools component: other products register as Visual Studio
      # instances too (SQL Server Management Studio, for one) and would otherwise win `-latest` and
      # resolve to an installation that ships no compiler. Best-effort — this is a diagnostic, so a
      # runner that cannot produce it must not fail the build.
      - name: Show exported JNI symbols
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$install\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1 -ExpandProperty FullName
          & $dumpbin /exports build\Release\SndCtrl.dll | Select-String "Java_|JNI_"

      - name: Upload SndCtrl.dll
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SndCtrl-dll
          path: build/Release/SndCtrl.dll
          if-no-files-found: error
